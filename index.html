<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简单网页抽奖</title>
  <style>
    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f7f9fc;
      color: #333;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      font-size: 15px;
      line-height: 1.5;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      box-sizing: border-box;
      resize: vertical;
      margin-top: 8px;
    }

    button {
      margin-top: 16px;
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #1677ff;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #0958d9;
    }

    #result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #f1f5ff;
      font-size: 20px;
      font-weight: bold;
      min-height: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>网页抽奖小工具</h1>
    <p>请在下面输入参与者名单，每行一个名字，然后点击“开始抽奖”。</p>

    <!-- 文本框：用于输入参与者名单（每行一个） -->
    <label for="nameList">参与抽奖人员名单：</label>
    <textarea id="nameList" placeholder="例如：\n张三\n李四\n王五"></textarea>

    <!-- 按钮：点击后触发抽奖逻辑 -->
    <button id="drawBtn">开始抽奖</button>

    <!-- 结果展示区域：清晰显示中奖人 -->
    <div id="result">中奖人：尚未抽取</div>
  </div>

  <script>
    // 获取页面中的关键元素
    const nameListInput = document.getElementById('nameList');
    const drawBtn = document.getElementById('drawBtn');
    const resultBox = document.getElementById('result');

    // 绑定按钮点击事件
    drawBtn.addEventListener('click', function () {
      // 1. 读取文本框内容，并按换行分割成数组
      const rawText = nameListInput.value;
      const names = rawText
        .split('\n') // 按行拆分
        .map(name => name.trim()) // 去掉每行前后的空格
        .filter(name => name !== ''); // 过滤空行

      // 2. 检查是否有可用名单
      if (names.length === 0) {
        resultBox.textContent = '中奖人：请先输入有效的名单';
        return;
      }

      // 3. 生成随机下标，并选出中奖者
      const randomIndex = Math.floor(Math.random() * names.length);
      const winner = names[randomIndex];

      // 4. 显示结果
      resultBox.textContent = '中奖人：' + winner;
    });
  </script>
</body>
</html>
